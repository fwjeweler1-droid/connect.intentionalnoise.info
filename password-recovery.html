0/api.js?render=explicit';script.onload=()=>{widget=window.turnstile.render('#challenge',{sitekey:TURNSTILE_SITE_KEY,callback:t=>{token=t;$('submit').disabled=false;note('Verification complete. You can request your recovery email.')},'expired-callback':()=>{token='';$('submit').disabled=true;note('Verification expired. Please complete it again.')},'error-callback':()=>{token='';$('submit').disabled=true;note('Security verification failed. Please retry the check.')}})};script.onerror=()=>note('Could not load security verification. Please reload this page.');document.head.append(script)}$('form').addEventListener('submit',async e=>{e.preventDefault();if(!token){note('Complete security verification first.');return}const current=token;token='';$('submit').disabled=true;note('Requesting recovery email…');try{const {error}=await client.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:location.origin+'/account-settings.html',captchaToken:current});if(error){note(error.code==='captcha_failed'?'Security verification was rejected. Please complete a fresh check.':error.code==='over_email_send_rate_limit'?'Too many requests. Wait before trying again.':'Recovery request failed: '+(error.message||'Please try later.'))}else note('If this email has a Connect account, a password-reset link has been requested. Check Inbox and Spam.')}catch(err){note('Recovery request failed: '+(err?.message||'Network error.'))}finally{if(widget!==null&&window.turnstile)window.turnstile.reset(widget)}});init();</script></body></html>
